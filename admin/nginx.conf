server {
    listen 81;
    server_name _;

    root /usr/share/nginx/html;

    absolute_redirect off;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
