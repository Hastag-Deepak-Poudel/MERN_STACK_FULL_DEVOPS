apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-to-backend
spec:
  parentRefs:
  - name: ecommerce-gateway

  # No hostnames on purpose. The gateway Service stays type: LoadBalancer with a
  # <pending> address, so you reach it with:
  #   kubectl port-forward svc/ecommerce-gateway-my-gateway-class 8080:80
  # The Host header is then "localhost:8080" (or 127.0.0.1:8080 with a raw
  # client), which would NOT match a hostname: [localhost] constraint. Leaving
  # hostnames unset makes this route match every Host header.
  #
  # Rules are ordered longest prefix first. Gateway API precedence also picks the
  # longest matching path regardless of list order, so this is for readability.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend
      port: 4000

  - matches:
    - path:
        type: PathPrefix
        value: /images
    backendRefs:
    - name: backend
      port: 4000

  - matches:
    - path:
        type: PathPrefix
        value: /admin
    backendRefs:
    - name: admin
      port: 81

  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 80
